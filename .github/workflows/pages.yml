name: Publicar no GitHub Pages

on:
  push:
    # O Pages só publica a partir da branch padrão do repositório (hoje: main).
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /sistema-gerencia/
          # URL e chave PÚBLICA (publishable) do backend; nunca coloque chaves secretas aqui.
          VITE_SUPABASE_URL: https://c--aa51747c-ba65-4d20-9c52-564f2957329e-prod.lovable.cloud
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jzgWyphun3EAm5pYeG0AWA_IspfxZfi
      - name: Fallback de SPA (rotas diretas funcionam em 404.html)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
